[project]
name = "unfold"
version = "0.1.0"
description = "Turn a research paper into a narrated, 3Blue1Brown-style Manim video"
requires-python = ">=3.11,<3.14"
dependencies = [
    "manim>=0.19",
    "pyyaml>=6",
    "pymupdf>=1.24",
    "sympy>=1.13",
    "lark>=1.1",
    "certifi",
]

[project.optional-dependencies]
kokoro = ["kokoro-onnx>=0.4", "soundfile>=0.12"]

[project.scripts]
unfold = "unfold.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unfold"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.black]
line-length = 100
target-version = ["py311"]
